<script>
var lang="en";try{lang=localStorage.getItem("lg")||"en"}catch(e){}
var $=function(i){return document.getElementById(i)};
var F={
 app:{en:"Applicant type",hi:"आवेदक का प्रकार",o:[["Individual","व्यक्ति"],["Firm / LLP","फर्म / LLP"],["Company","कंपनी"]]},
 fname:{en:"Father's name",hi:"पिता का नाम"},
 dob:{en:"Date of birth",hi:"जन्म तिथि",t:"date"},
 pan:{en:"PAN number",hi:"पैन नंबर"},
 change:{en:"What to change?",hi:"क्या बदलना है?"},
 biz:{en:"Business name",hi:"व्यवसाय का नाम"},
 btype:{en:"Business type",hi:"व्यवसाय का प्रकार",o:[["Proprietor","प्रोप्राइटर"],["Partnership","पार्टनरशिप"],["Company","कंपनी"]]},
 turn:{en:"Annual turnover",hi:"सालाना टर्नओवर",o:[["Up to 12 lakh","12 लाख तक"],["12 lakh to 20 crore","12 लाख से 20 करोड़"],["Above 20 crore","20 करोड़ से ऊपर"]]},
 lic:{en:"Existing licence number",hi:"मौजूदा लाइसेंस नंबर"},
 gstin:{en:"GSTIN",hi:"GSTIN"},
 period:{en:"Return period (month/quarter)",hi:"रिटर्न अवधि (माह/तिमाही)"},
 fy:{en:"Financial year",hi:"वित्त वर्ष"},
 reason:{en:"Reason",hi:"कारण"}
};
var S={
 pan:{ic:"🪪",en:"PAN Card",hi:"पैन कार्ड",t:[
  ["New PAN card","नया पैन कार्ड",["app","fname","dob"]],
  ["PAN correction / changes","पैन में सुधार / बदलाव",["pan","change"]],
  ["Reprint of PAN","पैन रीप्रिंट",["pan"]],
  ["Link PAN with Aadhaar","पैन–आधार लिंक",["pan"]]]},
 fssai:{ic:"🍽️",en:"FSSAI Licence",hi:"FSSAI लाइसेंस",t:[
  ["New registration / licence","नया रजिस्ट्रेशन / लाइसेंस",["biz","btype","turn"]],
  ["Licence renewal","लाइसेंस रिन्यूअल",["lic","biz"]],
  ["Modification of details","जानकारी में बदलाव",["lic","change"]],
  ["Annual return (D-1)","वार्षिक रिटर्न (D-1)",["lic","fy"]]]},
 gst:{ic:"📑",en:"GST",hi:"GST",t:[
  ["New GST registration","नया GST रजिस्ट्रेशन",["biz","btype","turn"]],
  ["Return filing (GSTR-1 / 3B)","रिटर्न फाइलिंग (GSTR-1 / 3B)",["gstin","period"]],
  ["Annual return (GSTR-9)","वार्षिक रिटर्न (GSTR-9)",["gstin","fy"]],
  ["Cancellation / notice","रद्दीकरण / नोटिस",["gstin","reason"]]]}
};
var V={},cur={s:"",t:-1};
function L(a){return lang=="hi"?a[1]:a[0]}
function tx(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(e){e.innerHTML=e.getAttribute("data-t").split("|")[lang=="hi"?1:0]});
  $("lang").textContent=lang=="hi"?"EN":"हिंदी";
  $("name").placeholder=L(["Your name","आपका नाम"]);$("mob").placeholder=L(["10-digit number","10 अंकों का नंबर"]);
  $("msg").placeholder=L(["Any extra details","कोई अन्य जानकारी"]);
  cards();selects();dyn();price();
}
function cards(){
  var h="";
  Object.keys(S).forEach(function(k){var s=S[k];
    h+='<div class="card"><div class="ic">'+s.ic+'</div><h3>'+(lang=="hi"?s.hi:s.en)+'</h3>';
    s.t.forEach(function(t,i){h+='<button class="opt" type="button" data-s="'+k+'" data-i="'+i+'">'+(lang=="hi"?t[1]:t[0])+' <i>→</i></button>'});
    h+='</div>'});
  $("cards").innerHTML=h;
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(b.dataset.s,+b.dataset.i);$("apply").scrollIntoView()}});
}
function selects(){
  var o='<option value="">'+L(["Select","चुनें"])+'</option>';
  Object.keys(S).forEach(function(k){o+='<option value="'+k+'"'+(cur.s==k?" selected":"")+'>'+(lang=="hi"?S[k].hi:S[k].en)+'</option>'});
  $("svc").innerHTML=o;
  var t='<option value="">'+L(["Select","चुनें"])+'</option>';
  if(cur.s)S[cur.s].t.forEach(function(x,i){t+='<option value="'+i+'"'+(cur.t==i?" selected":"")+'>'+L(x)+'</option>'});
  $("typ").innerHTML=t;
}
function dyn(){
  var h="",ek=cur.s&&cur.t>=0?cur.s+cur.t:"";
  $("est").style.display=ek?"block":"none";
  if(ek)$("est").textContent=L(["Price: ","शुल्क: "])+chg(ek);$("dochint").textContent=cur.s?L(DL[cur.s]):"";
  if(cur.s&&cur.t>=0)S[cur.s].t[cur.t][2].forEach(function(k){var f=F[k],v=V[k]||"";
    h+='<label><span>'+(lang=="hi"?f.hi:f.en)+'</span>';
    if(f.o){h+='<select data-k="'+k+'" required><option value="">'+L(["Select","चुनें"])+'</option>';
      f.o.forEach(function(x,i){h+='<option value="'+x[0]+'"'+(v==x[0]?" selected":"")+'>'+L(x)+'</option>'});h+='</select>'}
    else h+='<input data-k="'+k+'" type="'+(f.t||"text")+'" value="'+v.replace(/"/g,"&quot;")+'" required>';
    h+='</label>'});
  $("dyn").innerHTML=h;
  $("dyn").querySelectorAll("[data-k]").forEach(function(e){e.onchange=e.oninput=function(){V[e.dataset.k]=e.value}});
}
function pick(s,i){cur.s=s;cur.t=i;selects();dyn()}
$("svc").onchange=function(){cur.s=this.value;cur.t=-1;selects();dyn()};
$("typ").onchange=function(){cur.t=this.value===""?-1:+this.value;dyn()};
$("lang").onclick=function(){lang=lang=="hi"?"en":"hi";try{localStorage.setItem("lg",lang)}catch(e){}tx()};
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".tab,.pane").forEach(function(x){x.classList.remove("on")});
  b.classList.add("on");$(b.dataset.d).classList.add("on")}});

var PR={};
var STG=[["Applied","आवेदन हुआ"],["Documents verified","दस्तावेज़ जाँचे गए"],["Filed on portal","पोर्टल पर फाइल हुआ"],["In processing","प्रोसेसिंग में"],["Completed","पूरा हुआ"]];
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chg(k){var p=PR[k];return p&&p.svc?"₹"+p.svc:L(["On request","संपर्क करें"])}
function kn(k){var s=S[k.slice(0,-1)],t=s.t[+k.slice(-1)];return L([s.en+" – "+t[0],s.hi+" – "+t[1]])}
function price(){
  var h='<tr><th>'+L(["Service","सेवा"])+'</th><th style="text-align:right">'+L(["Price","शुल्क"])+'</th></tr>';
  Object.keys(S).forEach(function(k){h+='<tr class="grp"><td colspan="2">'+S[k].ic+" "+L([S[k].en,S[k].hi])+'</td></tr>';
    S[k].t.forEach(function(t,i){h+='<tr><td>'+L(t)+'</td><td style="text-align:right"><b>'+chg(k+i)+'</b></td></tr>'})});
  $("ptab").innerHTML=h;
}
var DL={pan:["Needed: Aadhaar + one more ID proof, passport photo, signature.","ज़रूरी: आधार + एक और पहचान प्रमाण, पासपोर्ट फोटो, हस्ताक्षर।"],
 fssai:["Needed: photo ID, photo, address proof of premises, product list (more for State/Central).","ज़रूरी: फोटो आईडी, फोटो, दुकान का पता प्रमाण, उत्पाद सूची (राज्य/केंद्रीय में और)।"],
 gst:["Needed: PAN, Aadhaar, photo, address proof, bank proof (returns: invoices / sales-purchase sheet).","ज़रूरी: पैन, आधार, फोटो, पता प्रमाण, बैंक प्रमाण (रिटर्न: इनवॉइस / बिक्री-खरीद शीट)।"]};
fetch("/api/pricing").then(function(r){return r.json()}).then(function(p){PR=p;price();dyn()}).catch(function(){});
function post(u,fd,json){return fetch(u,{method:"POST",body:json?JSON.stringify(json):fd,headers:json?{"Content-Type":"application/json"}:{}}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error");return j})})}
function busy(b){$("f").querySelector("button[type=submit]").disabled=b}
$("f").onsubmit=function(e){
  e.preventDefault();if(cur.t<0)return;
  var fl=$("docs").files;if(!fl.length){alert(L(["Please upload your documents","कृपया दस्तावेज़ अपलोड करें"]));return}
  var fd=new FormData(),fv={};S[cur.s].t[cur.t][2].forEach(function(k){fv[k]=V[k]||""});
  fd.append("key",cur.s+cur.t);fd.append("fields",JSON.stringify(fv));
  ["name","mob","email","city","msg"].forEach(function(n){fd.append(n,$(n).value)});
  for(var i=0;i<fl.length;i++)fd.append("docs",fl[i]);
  busy(true);post("/api/orders",fd).then(pay).catch(function(err){alert(err.message);busy(false)});
};
function pay(o){location.href=o.checkoutUrl}
function done(id){
  var m=$("mob").value,ok=$("okbox");busy(false);ok.hidden=false;
  ok.innerHTML="✅ "+L(["Payment successful! Your Tracking ID:","भुगतान सफल! आपकी Tracking ID:"])+' <b style="font-size:1.25rem;user-select:all">'+esc(id)+'</b><br>'+L(["Status: Applied. Save this ID and track with your mobile number below.","स्टेटस: आवेदन हो गया। यह ID सुरक्षित रखें और नीचे मोबाइल नंबर से ट्रैक करें।"]);
  $("tid").value=id;$("tmob").value=m;$("f").reset();V={};cur={s:"",t:-1};selects();dyn();ok.scrollIntoView();
}
try{var qs=new URLSearchParams(location.search);if(qs.get("tid"))$("tid").value=qs.get("tid")}catch(e){}
$("tf").onsubmit=function(e){
  e.preventDefault();
  var id=$("tid").value.trim().toUpperCase(),m=$("tmob").value.trim(),q="id="+encodeURIComponent(id)+"&mobile="+encodeURIComponent(m);
  fetch("/api/track?"+q).then(function(r){return r.ok?r.json():null}).then(function(a){
    var o="";
    if(!a)o='<p style="color:var(--acc);font-weight:600">'+L(["No application found. Check your ID and mobile number.","आवेदन नहीं मिला। ID और मोबाइल नंबर जाँचें।"])+'</p>';
    else{o='<p style="margin:16px 0 0"><b>'+esc(a.track)+'</b> · '+esc(a.name)+'<br>'+kn(a.key)+'</p><p><span class="pill">'+L(STG[a.status])+'</span>'+(a.arn?' &nbsp; ARN / Ref: <b>'+esc(a.arn)+'</b>':"")+'</p><ul class="tl">';
      STG.forEach(function(g,i){o+='<li class="'+(i<a.status?"d":i==a.status?"d c":"")+'">'+L(g)+'</li>'});o+='</ul>';
      if(a.log.length)o+='<p class="note">'+a.log.map(function(x){return esc(new Date(x.t).toLocaleDateString())+": "+esc(x.n)}).join("<br>")+'</p>';
      if(a.hasInvoice)o+='<p><a class="btn alt" href="/api/track/invoice?'+q+'">🧾 '+L(["Download invoice (PDF)","इनवॉइस डाउनलोड करें (PDF)"])+'</a></p>';
      if(a.hasResult)o+='<p><a class="btn" href="/api/track/download?'+q+'">⬇ '+L(["Download your document","अपना दस्तावेज़ डाउनलोड करें"])+'</a></p>'}
    $("tout").innerHTML=o});
};
tx();
</script>
</body>
</html>
